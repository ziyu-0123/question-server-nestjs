services:
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build: .
    ports:
      - '3005:3005'
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: nestdb
      JWT_SECRET: change-me
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      - mongodb

volumes:
  mongo-data:
